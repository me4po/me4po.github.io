baseURL = "https://me4po.github.io/"
# languageCode 是 ≤0.157 的写法（0.158+ 改用 locale，这里是 WARN 不是 ERROR）。
# 保留旧写法是为了与 .github/workflows/hugo.yml 里固定的 Hugo 0.147.7 保持一致；
# 若把版本升到 0.158+ 并确认生效，可换成 locale = "zh-CN"。
languageCode = "zh-CN"
hasCJKLanguage = true
title = "TERMINAL // LOG"
theme = "terminal"
# paginate 在 Hugo 0.128 废弃、后续版本已移除（Cloudflare 上直接报 ERROR）。
# 用 dotted key 写，避免 [pagination] 表把后面的顶层键吞掉。
pagination.pagerSize = 10
enableRobotsTXT = false
enableGitInfo = false

# 时区陷阱修复：GitHub Actions 构建机按 UTC 运行。
# 北京时间 08:00 之前发布、front matter 里只写当天日期（如 date: 2026-10-21）的文章，
# 其 publishDate 是 2026-10-21T00:00:00Z，在 UTC 下仍属"未来"，Hugo 默认会跳过不产出。
# 本站不做定时发布，故全局开启 buildFuture，避免"文章推上去了页面却没有"的诡异现象。
buildFuture = true

[params]
  author = "站长"
  description = "一个在终端里写东西的地方"
  # 首页打字机副标题（V-04）
  tagline = "> 记录一些还没被想清楚的东西"
  # 归档页 / 关于页 的终端提示符文案
  prompt = "visitor@terminal-log"

[params.effects]
  # Q-11 默认取向：偏克制。默认只开 V-01/V-02/V-03/V-04/V-05/V-08
  # 其余效果已实现，确认性能与观感后再把开关打开（无需改代码）
  asciiLogo = true     # V-03
  typewriter = true    # V-04
  cursor = true        # V-05
  terminalCode = true  # V-08
  scanlines = false    # V-06
  glitch = false       # V-07
  commandBar = false   # V-10
  themeToggle = false  # V-13

[params.comments]
  # GitHub Pages 是纯静态托管，没有运行时后端，评论接口无处部署。
  # 关闭后主题不会渲染评论区，也不会发起 /api/comments 请求。
  # 以后若接入独立评论服务（如 Cloudflare Worker），把 enabled 改回 true
  # 并把 api / admin 页地址改成对应的绝对 URL。
  enabled = false
  api = "/api/comments"
  pageSize = 50
  notice = "评论经站长审核后公开显示。请留下你的看法，不需要注册账号。"

[markup]
  [markup.highlight]
    # 关闭内联样式，改用自定义 chroma class 配色（V-08 终端风代码块）
    noClasses = false
    lineNos = true
    lineNumbersInTable = false
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[taxonomies]
  tag = "tags"

[[menu.main]]
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 2

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 3

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 4
