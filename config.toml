baseURL = "https://REPLACE-ME.pages.dev/"
languageCode = "zh-cn"
hasCJKLanguage = true
title = "TERMINAL // LOG"
theme = "terminal"
paginate = 10
enableRobotsTXT = false
enableGitInfo = false

[params]
  author = "站长"
  description = "一个在终端里写东西的地方"
  # 首页打字机副标题（V-04）
  tagline = "> 记录一些还没被想清楚的东西"
  # 归档页 / 关于页 的终端提示符文案
  prompt = "visitor@terminal-log"

[params.effects]
  # Q-11 默认取向：偏克制。默认只开 V-01/V-02/V-03/V-04/V-05/V-08
  # 其余效果已实现，确认性能与观感后再把开关打开（无需改代码）
  asciiLogo = true     # V-03
  typewriter = true    # V-04
  cursor = true        # V-05
  terminalCode = true  # V-08
  scanlines = false    # V-06
  glitch = false       # V-07
  commandBar = false   # V-10
  themeToggle = false  # V-13

[params.comments]
  enabled = true
  api = "/api/comments"
  pageSize = 50
  notice = "评论经站长审核后公开显示。请留下你的看法，不需要注册账号。"

[markup]
  [markup.highlight]
    # 关闭内联样式，改用自定义 chroma class 配色（V-08 终端风代码块）
    noClasses = false
    lineNos = true
    lineNumbersInTable = false
    tabWidth = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[taxonomies]
  tag = "tags"

[[menu.main]]
  name = "首页"
  url = "/"
  weight = 1

[[menu.main]]
  name = "归档"
  url = "/archives/"
  weight = 2

[[menu.main]]
  name = "标签"
  url = "/tags/"
  weight = 3

[[menu.main]]
  name = "关于"
  url = "/about/"
  weight = 4
