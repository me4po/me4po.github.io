{{ $commentsOn := true }}
{{ if isset .Params "comments" }}{{ $commentsOn = .Params.comments }}{{ end }}
{{ with site.Params.comments.giscus }}
{{ if and site.Params.comments.enabled $commentsOn .repo_id .category_id }}

<section class="comments" id="comments">
  <h2 class="comments-title">// 评论</h2>
  <p class="comments-notice">使用 GitHub 账号登录后评论；评论保存在本仓库的 Discussions 中。</p>

  <div class="giscus"></div>
  <script src="https://giscus.app/client.js"
    data-repo="{{ .repo }}"
    data-repo-id="{{ .repo_id }}"
    data-category="{{ .category }}"
    data-category-id="{{ .category_id }}"
    data-mapping="{{ .mapping }}"
    data-strict="{{ .strict }}"
    data-reactions-enabled="{{ .reactions_enabled }}"
    data-emit-metadata="{{ .emit_metadata }}"
    data-input-position="{{ .input_position }}"
    data-theme="{{ .theme }}"
    data-lang="{{ .lang }}"
    data-loading="{{ .loading }}"
    crossorigin="anonymous"
    async>
  </script>
</section>

{{ end }}
{{ end }}
